server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taptaza
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Twilio WhatsApp Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your-account-sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your-auth-token}
  whatsapp-from: whatsapp:+14155238886

logging:
  level:
    com.taptaza: DEBUG
    org.springframework.security: DEBUG
